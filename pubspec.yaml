name: badminton_pro
description: "Badminton Pro — multi-tenant badminton coaching management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.18.2

  # State management & routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # UI
  google_fonts: ^8.0.0
  cached_network_image: ^4.0.4

  # Utilities
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  uuid: ^4.6.0

  # Push notifications
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
